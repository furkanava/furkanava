<svg xmlns="http://www.w3.org/2000/svg" width="800" height="264" viewBox="0 0 800 264" role="img" aria-label="Terminal: furkan k&#252;l, mobile developer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BB9AF7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="-16" width="0" height="24"><animate attributeName="width" from="0" to="72" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="-16" width="0" height="24"><animate attributeName="width" from="0" to="100" begin="1.9s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="-16" width="0" height="24"><animate attributeName="width" from="0" to="112" begin="3.5s" dur="0.65s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .p { fill: #BB9AF7; font-weight: 700; }
    .c { fill: #C0CAF5; }
    .o { fill: #9AA5CE; }
    .h { fill: #FFFFFF; font-weight: 700; }
    .k { fill: #7AA2F7; }
    .d { fill: #565F89; }
    .cur { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="799" height="263" rx="14" fill="#0D1117" stroke="#30363D"/>
  <rect x="0.5" y="0.5" width="799" height="263" rx="14" fill="url(#glow)"/>
  <path d="M14.5 0.5h771a14 14 0 0 1 14 14v25.5h-799v-25.5a14 14 0 0 1 14-14z" fill="#161B22"/>
  <line x1="0.5" y1="40" x2="799.5" y2="40" stroke="#30363D"/>
  <circle cx="22" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="20" r="6" fill="#28C840"/>
  <text x="400" y="25" text-anchor="middle" class="d" font-size="12">furkan@github &#8212; ~</text>

  <!-- line 1: $ whoami -->
  <g transform="translate(28 72)">
    <text class="p">$</text>
    <g transform="translate(18 0)" clip-path="url(#c1)"><text class="c">whoami</text></g>
  </g>

  <!-- line 2: output -->
  <g transform="translate(28 98)" opacity="0">
    <animate attributeName="opacity" to="1" begin="1.05s" dur="0.15s" fill="freeze"/>
    <text><tspan class="h">furkan k&#252;l</tspan><tspan class="d"> &#183; </tspan><tspan class="o">mobile developer</tspan></text>
  </g>

  <!-- line 3: $ ls skills/ -->
  <g transform="translate(28 130)" opacity="0">
    <animate attributeName="opacity" to="1" begin="1.85s" dur="0.05s" fill="freeze"/>
    <text class="p">$</text>
    <g transform="translate(18 0)" clip-path="url(#c3)"><text class="c">ls skills/</text></g>
  </g>

  <!-- line 4: output -->
  <g transform="translate(28 156)" opacity="0">
    <animate attributeName="opacity" to="1" begin="2.65s" dur="0.15s" fill="freeze"/>
    <text class="k">flutter    dart    swift    python    c++    firebase</text>
  </g>

  <!-- line 5: $ cat now.txt -->
  <g transform="translate(28 188)" opacity="0">
    <animate attributeName="opacity" to="1" begin="3.45s" dur="0.05s" fill="freeze"/>
    <text class="p">$</text>
    <g transform="translate(18 0)" clip-path="url(#c5)"><text class="c">cat now.txt</text></g>
  </g>

  <!-- line 6: output -->
  <g transform="translate(28 214)" opacity="0">
    <animate attributeName="opacity" to="1" begin="4.3s" dur="0.15s" fill="freeze"/>
    <text class="o">shipping mobile apps <tspan class="d">&#183;</tspan> training small models <tspan class="d">&#183;</tspan> breaking things at hackathons</text>
  </g>

  <!-- final prompt + cursor -->
  <g transform="translate(28 240)" opacity="0">
    <animate attributeName="opacity" to="1" begin="5s" dur="0.05s" fill="freeze"/>
    <text class="p">$</text>
    <rect x="18" y="-12" width="8" height="15" fill="#BB9AF7" class="cur"/>
  </g>
</svg>
